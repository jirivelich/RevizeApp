<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RevizeApp – Návrh C: Modern Elevated</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background: #f0f7ff;
    background: linear-gradient(145deg, #eef6ff 0%, #e8f1fd 45%, #eef0ff 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    position: relative; overflow: hidden;
  }

  /* Decorative background blobs */
  .blob-1 {
    position: fixed; top: -120px; right: -80px;
    width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle, rgba(59,130,246,0.10) 0%, transparent 65%);
    pointer-events: none;
  }
  .blob-2 {
    position: fixed; bottom: -100px; left: -60px;
    width: 460px; height: 460px; border-radius: 50%;
    background: radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 65%);
    pointer-events: none;
  }
  .blob-3 {
    position: fixed; top: 40%; left: 50%; transform: translateX(-50%);
    width: 700px; height: 300px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(59,130,246,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Card */
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 48px rgba(59,130,246,0.13), 0 2px 12px rgba(0,0,0,0.05);
    overflow: hidden;
  }

  /* Blue accent top bar */
  .card-top {
    height: 5px;
    background: linear-gradient(90deg, #3b82f6 0%, #6366f1 100%);
  }

  .card-body { padding: 40px 40px 36px; }

  /* Logo area */
  .logo-area { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
  .logo-ring {
    width: 62px; height: 62px;
    border-radius: 18px;
    background: linear-gradient(135deg, #eff6ff, #dbeafe);
    border: 2px solid #bfdbfe;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
    box-shadow: 0 2px 12px rgba(59,130,246,0.18);
  }
  .logo-ring svg { width: 30px; height: 30px; stroke: #2563eb; fill: none; }
  .logo-name { font-size: 23px; font-weight: 800; color: #0f172a; letter-spacing: -0.6px; }
  .logo-sub { font-size: 13px; color: #94a3b8; margin-top: 4px; }

  /* Tab underline style */
  .tabs { display: flex; border-bottom: 2px solid #f1f5f9; margin-bottom: 26px; }
  .tab {
    flex: 1; padding: 10px 0; border: none; background: none;
    font-size: 14px; font-weight: 500; cursor: pointer;
    color: #94a3b8; position: relative; transition: color .15s;
  }
  .tab.active { color: #2563eb; }
  .tab.active::after {
    content: ''; position: absolute;
    bottom: -2px; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, #3b82f6, #6366f1);
    border-radius: 2px 2px 0 0;
  }

  /* Fields with icons */
  .field { margin-bottom: 20px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 7px; }
  .input-wrap { position: relative; }
  .input-icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; stroke: #9ca3af; fill: none; pointer-events: none;
  }
  input {
    width: 100%; padding: 12px 14px 12px 40px;
    border: 2px solid #f1f5f9; border-radius: 10px;
    font-size: 14px; color: #0f172a;
    background: #f8fafc; outline: none; transition: all .15s;
  }
  input:focus {
    border-color: #3b82f6;
    background: white;
    box-shadow: 0 0 0 4px rgba(59,130,246,0.08);
  }
  input::placeholder { color: #c8d3df; }

  /* Forgot password */
  .forgot {
    display: block; text-align: right;
    font-size: 12px; color: #3b82f6;
    text-decoration: none; margin-top: -14px; margin-bottom: 22px;
  }
  .forgot:hover { text-decoration: underline; }

  /* Submit button */
  .btn {
    width: 100%; padding: 13px;
    background: #2563eb; color: white;
    border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: all .15s;
    box-shadow: 0 3px 10px rgba(37,99,235,0.28);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:hover {
    background: #1d4ed8;
    box-shadow: 0 4px 18px rgba(37,99,235,0.42);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0); }
  .btn svg { width: 16px; height: 16px; stroke: white; fill: none; }

  /* Footer */
  .form-footer { text-align: center; font-size: 13px; color: #94a3b8; margin-top: 20px; }
  .form-footer a { color: #2563eb; text-decoration: none; font-weight: 600; }
  .form-footer a:hover { text-decoration: underline; }

  /* Secure badge */
  .secure-badge {
    display: flex; align-items: center; gap: 5px;
    justify-content: center; margin-top: 18px;
    font-size: 11px; color: #c8d3df;
  }
  .secure-badge svg { width: 12px; height: 12px; stroke: #c8d3df; fill: none; }

  @media (max-width: 480px) {
    .card-body { padding: 30px 24px 28px; }
  }
</style>
</head>
<body>

  <div class="blob-1"></div>
  <div class="blob-2"></div>
  <div class="blob-3"></div>

  <div class="card">
    <div class="card-top"></div>
    <div class="card-body">

      <div class="logo-area">
        <div class="logo-ring">
          <svg viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div class="logo-name">RevizeApp</div>
        <div class="logo-sub">Správa elektro revizí</div>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab(this, 'login')">Přihlášení</button>
        <button class="tab" onclick="switchTab(this, 'register')">Registrace</button>
      </div>

      <!-- Login form -->
      <form id="login-form">
        <div class="field">
          <label>Uživatelské jméno</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <input type="text" placeholder="jan.novak">
          </div>
        </div>
        <div class="field">
          <label>Heslo</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <input type="password" placeholder="••••••••">
          </div>
        </div>
        <a href="#" class="forgot">Zapomněli jste heslo?</a>
        <button type="submit" class="btn">
          <svg viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          Přihlásit se
        </button>
      </form>

      <!-- Register form -->
      <form id="register-form" style="display:none">
        <div class="field">
          <label>Jméno</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <input type="text" placeholder="Jan Novák">
          </div>
        </div>
        <div class="field">
          <label>Uživatelské jméno</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <input type="text" placeholder="jan.novak">
          </div>
        </div>
        <div class="field">
          <label>Email</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <input type="email" placeholder="jan@firma.cz">
          </div>
        </div>
        <div class="field">
          <label>Heslo</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <input type="password" placeholder="••••••••">
          </div>
        </div>
        <button type="submit" class="btn">
          <svg viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
          </svg>
          Registrovat se
        </button>
      </form>

      <div class="form-footer" id="footer-text">
        Nemáte účet? <a href="#" onclick="switchToRegister(); return false;">Zaregistrujte se zdarma</a>
      </div>

      <div class="secure-badge">
        <svg viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
        </svg>
        Zabezpečené připojení · HTTPS
      </div>

    </div>
  </div>

<script>
  function switchTab(btn, mode) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('login-form').style.display = mode === 'login' ? 'block' : 'none';
    document.getElementById('register-form').style.display = mode === 'register' ? 'block' : 'none';
    document.getElementById('footer-text').innerHTML = mode === 'login'
      ? 'Nemáte účet? <a href="#" onclick="switchToRegister(); return false;">Zaregistrujte se zdarma</a>'
      : 'Již máte účet? <a href="#" onclick="switchToLogin(); return false;">Přihlaste se</a>';
  }
  function switchToRegister() { switchTab(document.querySelectorAll('.tab')[1], 'register'); }
  function switchToLogin() { switchTab(document.querySelectorAll('.tab')[0], 'login'); }
</script>

</body>
</html>
