<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RevizeApp – Návrh B: Dark Tech Circuit (červená)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background: #0a0505;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    position: relative; overflow: hidden;
  }

  /* Grid pattern */
  .bg-grid {
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(198,0,0,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(198,0,0,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Ambient glow orbs */
  .glow-1 {
    position: fixed; top: 15%; left: 10%;
    width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(198,0,0,0.14) 0%, transparent 65%);
    pointer-events: none;
  }
  .glow-2 {
    position: fixed; bottom: 5%; right: 5%;
    width: 450px; height: 450px; border-radius: 50%;
    background: radial-gradient(circle, rgba(160,0,0,0.10) 0%, transparent 65%);
    pointer-events: none;
  }

  /* SVG circuit decorations */
  .circuit-svg {
    position: fixed; inset: 0; pointer-events: none; opacity: 0.22;
  }

  /* Card wrapper + glow effect */
  .card-wrapper {
    position: relative; z-index: 10;
    width: 100%; max-width: 420px;
  }
  .card-glow {
    position: absolute; inset: -30px; z-index: -1;
    border-radius: 32px;
    background: radial-gradient(ellipse at center, rgba(198,0,0,0.22) 0%, transparent 70%);
    filter: blur(24px);
  }

  /* Glassmorphism card */
  .card {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 22px;
    padding: 44px 40px 36px;
  }

  /* Brand */
  .brand-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 32px; }
  .brand-icon {
    width: 52px; height: 52px;
    background: linear-gradient(135deg, #c60000 0%, #8b0000 100%);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 28px rgba(198,0,0,0.60), 0 0 60px rgba(198,0,0,0.18);
    margin-bottom: 14px;
  }
  .brand-icon svg { width: 26px; height: 26px; stroke: white; fill: none; }
  .brand-name { font-size: 22px; font-weight: 700; color: #f1f5f9; letter-spacing: -0.4px; }
  .brand-sub { font-size: 12px; color: #475569; margin-top: 4px; }

  /* Tabs */
  .tabs {
    display: flex; margin-bottom: 28px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px; padding: 4px;
  }
  .tab {
    flex: 1; padding: 9px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    background: transparent; color: #475569; transition: all .2s;
  }
  .tab.active {
    background: rgba(198,0,0,0.18);
    color: #fca5a5;
    border: 1px solid rgba(198,0,0,0.32);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }

  /* Form */
  .field { margin-bottom: 20px; }
  label { display: block; font-size: 13px; font-weight: 500; color: #64748b; margin-bottom: 7px; }
  input {
    width: 100%; padding: 11px 14px;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px; font-size: 14px; color: #e2e8f0;
    background: rgba(255,255,255,0.04); outline: none; transition: all .2s;
  }
  input:focus {
    border-color: rgba(198,0,0,0.55);
    background: rgba(198,0,0,0.06);
    box-shadow: 0 0 0 3px rgba(198,0,0,0.12);
  }
  input::placeholder { color: #3d0000; }

  .btn {
    width: 100%; padding: 13px; margin-top: 4px;
    background: linear-gradient(135deg, #c60000 0%, #9b0000 100%);
    color: white; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: all .2s;
    box-shadow: 0 4px 18px rgba(198,0,0,0.45);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:hover {
    background: linear-gradient(135deg, #e00000 0%, #c60000 100%);
    box-shadow: 0 4px 24px rgba(198,0,0,0.65);
    transform: translateY(-1px);
  }
  .btn svg { width: 16px; height: 16px; stroke: white; fill: none; }

  .form-footer { text-align: center; font-size: 13px; color: #334155; margin-top: 22px; }
  .form-footer a { color: #f87171; text-decoration: none; font-weight: 500; }
  .form-footer a:hover { color: #fca5a5; }

  /* Status dots decoration */
  .status-bar {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-bottom: 28px;
  }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #3d0000; }
  .status-dot.on { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
  .status-line { flex: 1; max-width: 60px; height: 1px; background: #1e1010; }
  .status-text { font-size: 11px; color: #334155; }
</style>
</head>
<body>

  <div class="bg-grid"></div>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <!-- Circuit board SVG decorations -->
  <svg class="circuit-svg" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <g stroke="#c60000" stroke-width="1" fill="none">
      <!-- Top left circuit traces -->
      <polyline points="80,80 80,200 200,200 200,120 360,120"/>
      <circle cx="80" cy="80" r="5" fill="#c60000"/>
      <circle cx="200" cy="200" r="4" fill="#c60000" opacity="0.6"/>
      <circle cx="360" cy="120" r="5" fill="#c60000"/>
      <rect x="355" y="115" width="10" height="10" fill="none" stroke="#c60000"/>
      <!-- Top right -->
      <polyline points="1360,60 1360,180 1200,180 1200,300 1100,300"/>
      <circle cx="1360" cy="60" r="5" fill="#c60000"/>
      <circle cx="1200" cy="180" r="4" fill="#c60000" opacity="0.6"/>
      <circle cx="1100" cy="300" r="5" fill="#c60000"/>
      <!-- Bottom left -->
      <polyline points="60,820 60,680 220,680 220,780 420,780"/>
      <circle cx="60" cy="820" r="5" fill="#c60000"/>
      <circle cx="220" cy="680" r="4" fill="#c60000" opacity="0.6"/>
      <circle cx="420" cy="780" r="5" fill="#c60000"/>
      <!-- Bottom right -->
      <polyline points="1380,840 1380,720 1240,720 1240,620 1060,620"/>
      <circle cx="1380" cy="840" r="5" fill="#c60000"/>
      <circle cx="1060" cy="620" r="5" fill="#c60000"/>
      <!-- Mid decorations -->
      <polyline points="120,420 260,420 260,500"/>
      <circle cx="120" cy="420" r="3" fill="#c60000" opacity="0.5"/>
      <polyline points="1320,450 1180,450 1180,380"/>
      <circle cx="1320" cy="450" r="3" fill="#c60000" opacity="0.5"/>
      <!-- Small component markers -->
      <rect x="195" y="116" width="10" height="8" fill="rgba(198,0,0,0.15)" stroke="#c60000"/>
      <rect x="1095" y="296" width="10" height="8" fill="rgba(198,0,0,0.15)" stroke="#c60000"/>
      <rect x="415" y="776" width="10" height="8" fill="rgba(198,0,0,0.15)" stroke="#c60000"/>
    </g>
  </svg>

  <div class="card-wrapper">
    <div class="card-glow"></div>
    <div class="card">

      <div class="brand-wrap">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div class="brand-name">RevizeApp</div>
        <div class="brand-sub">Správa elektro revizí</div>
      </div>

      <div class="status-bar">
        <div class="status-line"></div>
        <div class="status-dot on"></div>
        <span class="status-text">Systém online</span>
        <div class="status-dot on"></div>
        <div class="status-line"></div>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab(this, 'login')">Přihlášení</button>
        <button class="tab" onclick="switchTab(this, 'register')">Registrace</button>
      </div>

      <form id="login-form">
        <div class="field">
          <label>Uživatelské jméno</label>
          <input type="text" placeholder="jan.novak">
        </div>
        <div class="field">
          <label>Heslo</label>
          <input type="password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn">
          <svg viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          Přihlásit se
        </button>
      </form>

      <form id="register-form" style="display:none">
        <div class="field">
          <label>Jméno</label>
          <input type="text" placeholder="Jan Novák">
        </div>
        <div class="field">
          <label>Uživatelské jméno</label>
          <input type="text" placeholder="jan.novak">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" placeholder="jan@firma.cz">
        </div>
        <div class="field">
          <label>Heslo</label>
          <input type="password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn">
          <svg viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
          </svg>
          Registrovat se
        </button>
      </form>

      <div class="form-footer" id="footer-text">
        Nemáte účet? <a href="#" onclick="switchToRegister(); return false;">Zaregistrujte se</a>
      </div>
    </div>
  </div>

<script>
  function switchTab(btn, mode) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('login-form').style.display = mode === 'login' ? 'block' : 'none';
    document.getElementById('register-form').style.display = mode === 'register' ? 'block' : 'none';
    document.getElementById('footer-text').innerHTML = mode === 'login'
      ? 'Nemáte účet? <a href="#" onclick="switchToRegister(); return false;">Zaregistrujte se</a>'
      : 'Již máte účet? <a href="#" onclick="switchToLogin(); return false;">Přihlaste se</a>';
  }
  function switchToRegister() { switchTab(document.querySelectorAll('.tab')[1], 'register'); }
  function switchToLogin() { switchTab(document.querySelectorAll('.tab')[0], 'login'); }
</script>

</body>
</html>
